services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: joineazy
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    ports:
      - "5000:5000"
    environment:
      PORT: 5000
      DATABASE_URL: postgresql://neondb_owner:npg_KzYji20ADqaI@ep-dark-dust-aysp6i2i-pooler.c-5.us-east-2.aws.neon.tech/neondb?sslmode=require&channel_binding=require
      JWT_SECRET: zishan_loves_kirti
    depends_on:
      -db

  frontend:
    build: ./frontend
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  pgdata: